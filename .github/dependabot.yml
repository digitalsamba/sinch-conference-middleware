version: 2
updates:
  - package-ecosystem: npm
    directory: /sinch-ds
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /sinch-ds
    schedule:
      interval: weekly
    # Stay on the current Node LTS line; move majors by hand when the next LTS lands.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
