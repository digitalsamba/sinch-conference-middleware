name: Publish sinch-ds image
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Build and push only. Deploying is a step on the host (deploy.sh), so the CI runner
  # needs no SSH access to the server and holds none of the app's secrets.
  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t digitalsamba376/sinch-ds:latest -t "digitalsamba376/sinch-ds:${GITHUB_SHA::7}" ./sinch-ds
          docker push digitalsamba376/sinch-ds:latest
          docker push "digitalsamba376/sinch-ds:${GITHUB_SHA::7}"
