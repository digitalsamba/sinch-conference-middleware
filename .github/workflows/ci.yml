name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sinch-ds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sinch-ds/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Fail on known high/critical vulnerabilities in what ships.
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sinch-ds:ci ./sinch-ds
      - name: Container starts and reports healthy
        run: |
          cid=$(docker run -d -e ADMIN_AUTH_DISABLED=true sinch-ds:ci)
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$cid")
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs "$cid"
          [ "$status" = healthy ]
